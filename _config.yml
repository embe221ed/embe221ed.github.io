title: embe221ed
tagline: writeups, articles etc.
description: >-
  pwn and binary exploitation writeups, CTF notes, and the occasional
  article — by embe221ed of justCatTheFish.

url: https://blog.embe221ed.dev
baseurl: ""
lang: en
timezone: Europe/Warsaw

author:
  name: embe221ed
  team: justCatTheFish

# tmux status-left prints the SESSION name, and a session is named after the
# thing being worked on — `tmux new -s blog`. It is not the user: author.name
# is the user, and it appears in the pane titles as the `user` half of
# user@host. Both were reading author.name, which put the wrong noun in the
# status bar.
tmux:
  session: blog

github:
  username: embe221ed
twitter:
  username: embe221ed

social:
  name: embe221ed
  links:
    - https://github.com/embe221ed
    - https://twitter.com/embe221ed

# The terminal theme this site is generated from. Mirrors the active theme in
# interdotensional's config/general.yml; assets/css/interdot-theme.css is
# generated from the same source.
interdot:
  theme: gruvbox-material
  font: Maple Mono

# `jekyll draft "title"` and `jekyll publish _drafts/title.md`. These defaults
# are what a new file is born with, so a draft starts valid instead of starting
# empty — categories drives the tre index's directory, toc drives the contents
# pane, and both are easier to delete than to remember.
jekyll_compose:
  auto_open: false
  default_front_matter:
    drafts:
      categories: writeup
      tags: []
      toc: true
    posts:
      categories: writeup
      tags: []
      toc: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-toc

# /feed.xml is the live, indexed feed path. Do not change it — /rss.xml and
# /index.xml both 404 today, and subscribers are on this one.
feed:
  path: feed.xml

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      # Off deliberately. Rouge renders line numbers as REAL TEXT DIGITS in a
      # <td class="gutter">, which ride along on copy — paste an exploit and
      # you get "1 from pwn import *", which does not run. assets/css/syntax.css
      # carries the user-select:none mitigation if you ever want them back.
      line_numbers: false

excerpt_separator: <!--more-->

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      # DO NOT CHANGE. https://blog.embe221ed.dev/posts/<Title>/ is the live,
      # indexed permalink; the lowercase and short forms both 404 today.
      permalink: /posts/:title/

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: archive
    tag: archive
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .ruby-version
  # Build tooling, not content. Without this Jekyll copies the directory
  # verbatim and https://blog.embe221ed.dev/tools/og-cards.py becomes a real,
  # crawlable, sitemap-listed URL.
  - tools
