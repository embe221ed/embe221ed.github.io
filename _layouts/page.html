---
layout: default
---
<div class="wrap surface-term">
  <div class="panes">
    <section class="pane">
      <span class="pane__title">{{ site.author.name }}@blog:~/{{ page.title | slugify }}</span>

      <h1 class="ps1">
        <span class="ps1__line">
          <span class="ps1__caret" aria-hidden="true">❯</span>
          <span class="ps1__said">cat {{ page.title | slugify }}.md</span>
        </span>
      </h1>

      <div class="prose">
        {{ content }}
      </div>
    </section>
  </div>
</div>
