# The tmux window list, in order.
#
# THE INDEX IS DELIBERATELY ABSENT. The real config sets `base-index 1`,
# `pane-base-index 1` and `renumber-windows on`, which together mean a window's
# number is a function of its position and nothing else — so the bar renders
# `forloop.index` and a literal number is never written down anywhere. Reorder
# these rows and the bar renumbers itself; add a row and you have a window.
#
#   name   the window name tmux draws after the colon
#   url    where the window navigates to
#   exact  match page.url exactly. Only `/` needs this — as a substring it
#          would match every path on the site.
#   paths  substrings of page.url that make this window the current one

- name: home
  url: /
  exact: true

# The window is named for what it opens, not for what the site mostly contains:
# it runs `choose-tree` over the categories, and one of those categories happens
# to be `writeup`. Calling it `writeups` promised a post list and delivered a
# chooser. /archives/ is the post list, and it is linked from the footer and the
# homepage.
- name: categories
  url: /categories/
  paths: ["/posts/", "/categories/", "/archives/"]

- name: tags
  url: /tags/
  paths: ["/tags/"]

- name: about
  url: /about/
  paths: ["/about/"]
